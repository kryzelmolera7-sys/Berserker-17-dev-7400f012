name: Fetch NNUE chunks

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify default NNUE network
        shell: bash
        run: |
          set -euo pipefail
          net=nn-d1ee674a62ca.nnue
          for url in \
            "https://tests.stockfishchess.org/api/nn/$net" \
            "https://github.com/official-stockfish/networks/raw/master/$net"; do
            echo "Trying $url"
            if curl -fL --retry 2 --retry-delay 2 --max-time 600 -o /tmp/net.nnue "$url"; then
              echo "d1ee674a62ca754648fb8c2907ff4e92f0c3acff28f59afa0f5bd4e3949538f1  /tmp/net.nnue" | sha256sum -c -
              break
            fi
          done
          test -s /tmp/net.nnue
          stat -c 'NNUE size: %s bytes' /tmp/net.nnue

      - name: Publish network chunks as Git blobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import pathlib
          import urllib.error
          import urllib.request

          api = "https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + token,
              "Content-Type": "application/json",
              "User-Agent": "nnue-chunk-fetcher",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(method, path, data=None):
              req = urllib.request.Request(
                  api + path, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=600) as response:
                      return response.status, response.read()
              except urllib.error.HTTPError as e:
                  raise RuntimeError(f"{method} {path} failed: {e.code} {e.read()[:500]!r}") from e

          def create_blob(content):
              payload = json.dumps({
                  "content": base64.b64encode(content).decode("ascii"),
                  "encoding": "base64",
              }).encode("ascii")
              status, body = request("POST", "/git/blobs", payload)
              assert status == 201
              return json.loads(body)["sha"]

          data = pathlib.Path("/tmp/net.nnue").read_bytes()
          digest = hashlib.sha256(data).hexdigest()
          assert digest == "d1ee674a62ca754648fb8c2907ff4e92f0c3acff28f59afa0f5bd4e3949538f1"

          chunk_size = 16 * 1024 * 1024
          blob_shas = []
          for index, start in enumerate(range(0, len(data), chunk_size)):
              chunk = data[start:start + chunk_size]
              sha = create_blob(chunk)
              blob_shas.append(sha)
              print(f"chunk {index}: {len(chunk)} bytes -> {sha}", flush=True)

          metadata = json.dumps({
              "filename": "nn-d1ee674a62ca.nnue",
              "sha256": digest,
              "size": len(data),
              "chunk_size": chunk_size,
              "blobs": blob_shas,
          }, indent=2).encode()
          metadata_sha = create_blob(metadata)
          print(f"metadata: {metadata_sha}", flush=True)

          ref_path = "/git/refs/tags/nnue-chunks"
          try:
              request("DELETE", ref_path)
          except RuntimeError as error:
              print("No existing metadata tag to replace:", error)

          payload = json.dumps({
              "ref": "refs/tags/nnue-chunks",
              "sha": metadata_sha,
          }).encode()
          status, body = request("POST", "/git/refs", payload)
          assert status == 201
          print("Published refs/tags/nnue-chunks")
          PY
